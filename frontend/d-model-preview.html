<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PolyJump · D 模型 14 向探索</title>
  <link rel="stylesheet" href="/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <section id="preview-page" class="page">
    <header class="menu-header">
      <h1>D 模型 · 14 向探索</h1>
      <p class="subtitle">6 向 + 8 向 = 14 向，观察不同几何形状</p>
    </header>

    <div class="preview-layout">
      <div class="preview-controls">
        <h2>几何候选</h2>
        <label class="switch-row">
          <input type="checkbox" id="show-cube" checked>
          <span>5×5×5 正方体</span>
        </label>
        <label class="switch-row">
          <input type="checkbox" id="show-l1" checked>
          <span>L1 球 R=6 全整数点</span>
        </label>
        <label class="switch-row">
          <input type="checkbox" id="show-l1-small">
          <span>L1 球 R=4 全整数点</span>
        </label>
        <label class="switch-row">
          <input type="checkbox" id="show-pyramids">
          <span>立方体 + 外部金字塔</span>
        </label>
        <label class="switch-row">
          <input type="checkbox" id="show-core" checked>
          <span>L1 满度核心 R=3（14 向完整）</span>
        </label>
        <hr>
        <label class="switch-row">
          <input type="checkbox" id="show-lines" checked>
          <span>显示 14 向连线</span>
        </label>
        <div class="preview-stats">
          <strong>当前点数</strong>
          <span id="point-count">0</span>
        </div>
        <p class="hint">鼠标左键旋转 / 右键平移 / 滚轮缩放</p>
      </div>
      <div id="preview-scene"></div>
    </div>
  </section>

  <script type="module" src="/d_model_preview.js"></script>
</body>
</html>
