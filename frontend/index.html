<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PolyJump</title>
  <link rel="stylesheet" href="/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <section id="menu-page" class="page">
    <header class="menu-header">
      <h1>PolyJump</h1>
      <p class="subtitle">可配置三维跳棋框架 · A / B 几何 · 规则自由组合</p>
    </header>

    <div class="menu-card">
      <div class="menu-section">
        <h2>棋盘</h2>

        <label class="field">
          <span>几何模型</span>
          <select id="geometry">
            <option value="A" selected>A 模型 · 正交网格</option>
            <option value="B">B 模型 · FCC 偶子晶格</option>
            <option value="C">C 模型 · L1 全整数 20 向</option>
            <option value="A_EXT">A-ext · 外接金字塔方向可配</option>
            <option value="D">D 模型 · 外接金字塔 14 向</option>
            <option value="B_EXT">B-ext · 外接金字塔 12 向</option>
            <option value="C_EXT">C-ext · 外接金字塔 20 向</option>
          </select>
        </label>

        <div class="field-row">
          <label class="field">
            <span>X</span>
            <input id="board-x" type="number" value="9" min="3" max="15">
          </label>
          <label class="field">
            <span>Y</span>
            <input id="board-y" type="number" value="9" min="3" max="15">
          </label>
          <label class="field">
            <span>Z</span>
            <input id="board-z" type="number" value="9" min="3" max="15">
          </label>
        </div>

        <label class="field hidden" id="b-radius-field">
          <span>L1 球半径（偶数）</span>
          <input id="b-radius" type="number" value="6" min="2" max="10" step="2">
        </label>
        <label class="field hidden" id="ep-side-field">
          <span>外接金字塔中心边长（奇数）</span>
          <input id="ep-side" type="number" value="5" min="3" max="9" step="2">
        </label>

        <label class="field">
          <span>玩家数</span>
          <select id="players">
            <option value="2" selected>2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="6">6</option>
            <option value="8">8</option>
          </select>
        </label>

        <label class="field" id="layers-field">
          <span>棋子层数（推荐最大值）</span>
          <input id="layers" type="number" value="4" min="1" max="4" step="1">
        </label>
        <p class="hint" id="layers-hint">不能超过最大值，可由玩家自行降低</p>
      </div>

      <div class="menu-section" id="direction-section">
        <h2>移动方向</h2>
        <p class="hint">方向规则由后端配置提供，前端自动扫描。</p>

        <div id="direction-checks" class="switch-list"></div>

        <p id="direction-summary" class="summary">加载方向规则中...</p>
      </div>

      <div class="menu-section">
        <h2>规则</h2>

        <div class="switch-list">
          <label class="switch-row">
            <input type="checkbox" id="allow-step" checked>
            <span>允许普通移动</span>
          </label>
          <label class="switch-row">
            <input type="checkbox" id="allow-jump" checked>
            <span>允许跳跃</span>
          </label>
          <label class="switch-row">
            <input type="checkbox" id="allow-chain" checked>
            <span>允许连跳</span>
          </label>
          <label class="switch-row">
            <input type="checkbox" id="allow-two-step">
            <span>允许两格跳（空一格跳）</span>
          </label>
        </div>

        <label class="field">
          <span>连跳模式</span>
          <select id="hop-mode">
            <option value="FREE_STOP" selected>自由停</option>
            <option value="FORCE_ALL">必须跳到底</option>
          </select>
        </label>

        <label class="field">
          <span>对局规则</span>
          <select id="capture-mode">
            <option value="NONE" selected>中国跳棋（搬运填目标区）</option>
            <option value="CAPTURE">西洋跳棋（吃光对方）</option>
            <option value="MIXED">混合模式（搬运为主，吃子送回原位）</option>
          </select>
        </label>

        <button id="start-btn" class="primary-btn">开始游戏</button>
        <p id="menu-error" class="error"></p>
      </div>
    </div>
  </section>

  <section id="game-page" class="page hidden">
    <div id="hud">
      <span id="status-text">加载中...</span>
      <div id="player-roster"></div>
      <div id="score-board"></div>
      <button id="back-btn">返回主菜单</button>
    </div>
    <div id="history-panel">
      <h3>对局记录</h3>
      <div id="history-moves"></div>
      <div id="replay-controls">
        <button id="replay-start" title="回到开局">⏮</button>
        <button id="replay-prev" title="上一步">◀</button>
        <button id="replay-next" title="下一步">▶</button>
        <button id="replay-end" title="最后一手">⏭</button>
        <button id="replay-auto">自动播放</button>
      </div>
    </div>
    <div id="scene-container"></div>
  </section>

  <script type="module" src="/menu.js"></script>
  <script type="module" src="/main.js"></script>
</body>
</html>
